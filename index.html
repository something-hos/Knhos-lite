<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>KNHOS Lite</title>
<link rel="stylesheet" href="styles/main.css">
</head>
<body>
<div id="app-shell">
<header id="app-header">
<div class="header-inner">
<div class="header-left">
<button class="back-btn hidden" id="global-back-btn" type="button" aria-label="Back to previous screen">&lsaquo; Back</button>
<button class="brand" id="brand-home-btn" type="button">
<span class="brand-title">KNHOS Lite</span>
</button>
<div class="role-switcher" role="tablist" aria-label="Active role">
<button type="button" class="role-toggle-btn" data-role="reception">Reception</button>
<button type="button" class="role-toggle-btn" data-role="doctor">Doctor</button>
</div>
</div>
<nav id="main-nav">
<button class="nav-btn" data-route="#/home">Home</button>
<button class="nav-btn" data-route="#/patients">Patients</button>
<button class="nav-btn" data-route="#/patients/new">New Patient</button>
<button class="nav-btn" data-route="#/settings">Settings</button>
</nav>
</div>
</header>
<div id="reception-alert-banner" class="reception-alert-banner hidden"></div>
<div id="dynamic-context-bar" class="context-bar-wrapper"></div>
<main id="app-main">
<div id="view-root"></div>
</main>
</div>
<div id="modal-root">
<div id="tooth-modal-backdrop" class="modal-backdrop closed">
<div id="tooth-modal" class="tooth-modal" role="dialog" aria-modal="true">
<div class="tooth-modal-header">
<span id="tooth-modal-title">Tooth #—</span>
<button id="tooth-modal-close" type="button" aria-label="Close">✕</button>
</div>
<div class="tooth-modal-tabs" role="tablist">
<button class="tooth-tab-btn active" type="button" data-tab="findings">Findings</button>
<button class="tooth-tab-btn" type="button" data-tab="tx-planned">Tx Planned</button>
<button class="tooth-tab-btn" type="button" data-tab="tx-done">Tx Done Today</button>
</div>
<div class="tooth-tab-panel" data-panel="findings">
<label>Finding
<select id="finding-select">
<option value="">— Select —</option>
<option value="deep-caries">Deep Caries</option>
<option value="moderate-caries">Moderate Caries</option>
<option value="mobile">Mobile</option>
<option value="fractured">Fractured</option>
<option value="periapical-abscess">Periapical Abscess</option>
<option value="missing">Missing</option>
<option value="impacted">Impacted</option>
</select>
</label>
</div>
<div class="tooth-tab-panel hidden" data-panel="tx-planned">
<label>Treatment Planned
<select id="tx-planned-select">
<option value="">— Select —</option>
<option value="rct">RCT (Root Canal Treatment)</option>
<option value="extraction">Extraction</option>
<option value="crown-prep">Crown Prep</option>
<option value="filling">Filling / Restoration</option>
<option value="braces">Braces / Ortho</option>
<option value="scaling">Scaling</option>
</select>
</label>
<div id="tooth-consent-block">
<button id="link-consent-btn" type="button" class="link-consent-btn">🖊 Link Consent (Capture Signature)</button>
<span id="consent-linked-badge" class="consent-badge hidden">Consent Linked ✓</span>
<div id="tooth-signature-capture" class="tooth-signature-capture hidden">
<div class="signature-pad-wrapper small">
<canvas id="tooth-signature-pad"></canvas>
</div>
<div class="tooth-signature-actions">
<button type="button" id="tooth-sig-clear-btn" class="btn btn-secondary btn-sm">Clear</button>
<button type="button" id="tooth-sig-cancel-btn" class="btn btn-secondary btn-sm">Cancel</button>
<button type="button" id="tooth-sig-save-btn" class="btn btn-primary btn-sm">Save Signature</button>
</div>
</div>
</div>
<div id="tooth-consent-status" class="tooth-consent-status hidden">
<span id="tooth-consent-status-text"></span>
<button id="tooth-consent-resolve-btn" type="button" class="tooth-consent-resolve-btn hidden">Resolve Consent</button>
</div>
</div>
<div class="tooth-tab-panel hidden" data-panel="tx-done">
<label>Treatment Done Today
<select id="tx-done-select">
<option value="">— Select —</option>
<option value="excavation">Excavation</option>
<option value="rct-started">RCT Started</option>
<option value="rct-completed">RCT Completed</option>
<option value="extraction-done">Extraction Done</option>
<option value="filling-done">Filling Placed</option>
</select>
</label>
</div>
<div class="tooth-modal-footer">
<button id="tooth-modal-save" type="button">Save</button>
</div>
</div>
</div>
<div id="consent-prompt-backdrop" class="consent-prompt-backdrop closed">
<div id="consent-prompt-modal" class="consent-prompt-modal" role="dialog" aria-modal="true" aria-labelledby="consent-prompt-title">
<button id="consent-prompt-close-btn" type="button" class="consent-prompt-close-btn" aria-label="Close">✕</button>
<div class="consent-prompt-icon">⚠</div>
<h3 id="consent-prompt-title">Consent Required</h3>
<p id="consent-prompt-message" class="consent-prompt-message"></p>
<div class="consent-prompt-actions">
<button id="consent-prompt-next-visit-btn" type="button" class="btn btn-secondary">Obtain Consent Next Visit</button>
<button id="consent-prompt-this-visit-btn" type="button" class="btn btn-primary">Obtain Consent This Visit</button>
</div>
</div>
</div>
<div id="consent-overlay-backdrop" class="consent-overlay-backdrop closed">
<div id="consent-overlay" class="consent-overlay" role="dialog" aria-modal="true" aria-labelledby="consent-overlay-title">
<div class="consent-overlay-header">
<div class="consent-overlay-header-text">
<h2 id="consent-overlay-title">Informed Consent</h2>
<p id="consent-overlay-meta" class="consent-overlay-meta"></p>
</div>
<button id="consent-overlay-close-btn" type="button" aria-label="Close">✕</button>
</div>
<div class="consent-overlay-body">
<div class="consent-lang-toggle" role="tablist" aria-label="Consent language">
<button type="button" id="consent-lang-en-btn" class="consent-lang-toggle-btn active" data-lang="en">English</button>
<button type="button" id="consent-lang-ta-btn" class="consent-lang-toggle-btn" data-lang="ta">Tamil</button>
</div>
<div id="consent-overlay-text-container" class="consent-text-body"></div>
<div class="consent-signature-block">
<label class="consent-signature-label" for="consent-signature-pad">Patient / Guardian Signature *</label>
<div class="signature-pad-wrapper">
<canvas id="consent-signature-pad"></canvas>
</div>
<button type="button" id="consent-sig-clear-btn" class="btn btn-secondary btn-sm">Clear Signature</button>
</div>
</div>
<div class="consent-overlay-footer">
<button id="consent-overlay-cancel-btn" type="button" class="btn btn-secondary">Cancel</button>
<button id="consent-overlay-save-btn" type="button" class="btn btn-primary">Save</button>
</div>
</div>
</div>
</div>
<script src="js/db.js"></script>
<script src="js/idgen.js"></script>
<script src="js/patients.js"></script>
<script src="js/router.js"></script>
<script src="js/consents.js"></script>
<script src="js/visits.js"></script>
<script src="js/app.js"></script>
</body>
</html>
