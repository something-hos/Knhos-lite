<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>KNHOS Lite</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KNHOS Lite">
<meta name="theme-color" content="#1f4d43">
<link rel="manifest" href="pwa/manifest.json">
<link rel="apple-touch-icon" href="pwa/icon-192.png">
<link rel="stylesheet" href="styles/main.css">
</head>
<body>

<div id="app-shell">
  <header id="app-header">
    <div class="header-inner">
      <button class="brand" id="brand-home-btn" type="button">
        <span class="brand-mark">K</span>
        <span class="brand-text">
          <span class="brand-title">KNHOS Lite</span>
          <span class="brand-subtitle">Temporary patient record system</span>
        </span>
      </button>
      <nav id="main-nav" aria-label="Main navigation">
        <button class="nav-btn" data-route="#/home">Home</button>
        <button class="nav-btn" data-route="#/patients">Patients</button>
        <button class="nav-btn" data-route="#/patients/new">New Patient</button>
        <button class="nav-btn" data-route="#/search">Search</button>
        <button class="nav-btn nav-btn-backup" data-route="#/backup">Backup / Export</button>
      </nav>
    </div>
  </header>

  <main id="app-main">
    <div id="view-root"></div>
  </main>
</div>

<script src="js/db.js"></script>
<script src="js/idgen.js"></script>
<script src="js/patients.js"></script>
<script src="js/router.js"></script>
<script src="js/visits.js"></script>
<script src="js/consents.js"></script>
<script src="js/app.js"></script>
</body>
</html>
